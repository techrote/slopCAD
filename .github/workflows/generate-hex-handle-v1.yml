name: Generate hex handle V1 STL

on:
  push:
    branches:
      - add-hex-handles-v1
    paths:
      - 'project/hex-handles/v1-32mm-five-rib/hex_handle_32mm_5rib_v1.scad'
      - '.github/workflows/generate-hex-handle-v1.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openscad

      - name: Generate printable STL
        run: |
          openscad             -o project/hex-handles/v1-32mm-five-rib/hex_handle_32mm_5rib_v1.stl             project/hex-handles/v1-32mm-five-rib/hex_handle_32mm_5rib_v1.scad

      - name: Commit generated STL and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/hex-handles/v1-32mm-five-rib/hex_handle_32mm_5rib_v1.stl
          git rm .github/workflows/generate-hex-handle-v1.yml
          git commit -m "Generate hex handle V1 STL"
          git push
