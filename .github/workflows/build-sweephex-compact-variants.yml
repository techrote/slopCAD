name: Build SweepHex compact variants

on:
  push:
    branches:
      - feature/sweephex-compact-variants
    paths:
      - 'projects/fan-guards/sweephex_family_generator.py'
      - 'projects/fan-guards/requirements-variants.txt'
      - 'projects/fan-guards/validate_sweephex_variants.py'
      - '.github/workflows/build-sweephex-compact-variants.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install geometry dependencies
        run: python -m pip install -r projects/fan-guards/requirements-variants.txt

      - name: Generate compact SweepHex variants
        run: python projects/fan-guards/sweephex_family_generator.py --root projects/fan-guards

      - name: Validate generated STL and 3MF files
        run: python projects/fan-guards/validate_sweephex_variants.py

      - name: Commit generated CAD outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             projects/fan-guards/sweephex-120-xl             projects/fan-guards/sweephex-92-xl             projects/fan-guards/sweephex-80-xl             projects/fan-guards/sweephex-60-xl
          if git diff --cached --quiet; then
            echo "Generated files already match."
          else
            git commit -m "Generate SweepHex 120/92/80/60 XL CAD outputs"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
