name: Regenerate STL artifacts

on:
  push:
    branches: [main]
    paths:
      - 'projects/hex-bit-stand/**/*.scad'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate changed or missing STL files
        shell: bash
        run: |
          set -euo pipefail

          # The triggering commit may no longer be main HEAD if documentation or
          # another source commit landed while this run was queued. Remember the
          # SCAD paths changed by that exact commit, but operate on current main.
          mapfile -t changed_scads < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" --               'projects/hex-bit-stand/**/*.scad' || true
          )

          is_changed() {
            local candidate="$1"
            local changed
            for changed in "${changed_scads[@]}"; do
              [[ "$candidate" == "$changed" ]] && return 0
            done
            return 1
          }

          while IFS= read -r -d '' scad; do
            stl="${scad%.scad}.stl"
            if [[ ! -f "$stl" ]] || is_changed "$scad"; then
              echo "Rendering $scad -> $stl"
              openscad -o "$stl" "$scad"
            else
              echo "Keeping existing $stl"
            fi
          done < <(find projects/hex-bit-stand -type f -name '*.scad' -print0 | sort -z)

      - name: Commit regenerated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'projects/hex-bit-stand/**/*.stl'
          if git diff --cached --quiet; then
            echo "STLs already match their OpenSCAD sources."
          else
            git commit -m "Regenerate STL artifacts"
            git push origin HEAD:main
          fi
